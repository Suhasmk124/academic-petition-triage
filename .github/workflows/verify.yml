name: Verify service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate private ephemeral deployment keys
        run: python scripts/configure.py
      - name: Build and start complete deployment
        run: docker compose build api && docker compose up --no-build -d --scale worker=3
      - name: Await the background workers
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail=50
          exit 1
      - name: Regression and fixed evaluation
        run: docker compose exec -T api python src/check_project.py --service --evaluation
      - name: Install lightweight host acceptance client
        run: pip install httpx python-dotenv
      - name: Verify auth, conditional positions, metrics and traces
        run: python scripts/verify_stack.py --observability
      - name: Audit public repository contents
        run: python scripts/public_audit.py
      - name: Collect reports
        if: always()
        run: docker compose cp api:/app/evaluations/. evaluations/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verification-reports, path: evaluations/}
      - name: Shut down ephemeral deployment
        if: always()
        run: docker compose down -v
